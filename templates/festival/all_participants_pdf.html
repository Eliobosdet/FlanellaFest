      
<!DOCTYPE html>
<html>
<head>

    <style>
        /* Your CSS goes here */

            color: #333;

            margin: 0 auto;

            text-align: left;

        table {
            width: 100%;

        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;

        }

        .total {
            text-align: left;

</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Lista partecipanti generata il {% now "d/m/Y" %}</h1>
            <p>Totali: {{ participants|length }}</p>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Cognome</th>
                    <th>Telefono</th>
                    <th>E-Mail</th>
                </tr>
            </thead>
            <tbody>
                {% for p in participants %}
                <tr>
                    <td>{{ p.first_name }}</td>
                    <td>{{ p.last_name }}</td>
                    <td>{{ p.phone }}</td>
                    <td>{{ p.email }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>     
    </div>
</body>
</html>
