{% extends 'festival/base.html' %}
{% load static %}
{% block content %}

<!-- HOMEPAGE ASTRATTA / TIPOGRAFICA -->
<section class="poster-hero d-flex flex-column justify-content-between px-3 px-md-5 py-4">
    
    <!-- IMMAGINE MASCOTTE RESPONSIVE -->
    <div class="text-center my-2 my-md-4">
        <img src="{% static 'img/illustrazione_completa.png' %}" alt="Mascotte Flanella" class="hero-mascot-img" style="max-: 800px;">
    </div>

    <!-- CALL TO ACTION CENTRATA -->
    <div class="row align-items-center justify-content-center my-3 my-md-4">
        <div class="col-12 text-center">
            <p class="cta-subtitle fw-bold text-uppercase text-ink mb-3">Ingresso riservato ai soci APS</p>
            <a href="{% url 'register' %}" class="btn btn-festival px-4 py-2">
                TESSERAMENTO &rarr;
            </a>
        </div>
    </div>

    <!-- BODY: GLI ARTISTI FLUTTUANTI -->
    <div class="poster-artists-block text-center py-3 py-md-5">
        <div class="d-flex flex-wrap justify-content-center align-items-center" style="gap: 5px 20px;">
            <span class="artist-poster-text">MARTA GUIDOBONI</span>
            <span class="artist-poster-text sec-artist">ADRIANO MARINELLI</span>
            <span class="artist-poster-text">ENVELOPE</span>
            <span class="artist-poster-text">TAISTOI</span>
            <span class="artist-poster-text sec-artist">JULIETT</span>
            <span class="artist-poster-text">CORE MATO</span>
            <span class="artist-poster-text sec-artist">TARAB</span>
            <span class="artist-poster-text">UMARELLL</span>
        </div>
    </div>

</section>

{% endblock %}
